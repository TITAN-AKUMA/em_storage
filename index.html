<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XO Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1120, #1a2332);
            color: #e8edf5;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            padding: 2.5rem 2rem 2rem;
            border-radius: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.08);
            text-align: center;
            width: 400px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        h1 {
            font-weight: 500;
            font-size: 2.2rem;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #a0c0ff, #f9a8d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .turn-indicator {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            background: rgba(0,0,0,0.3);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .turn-indicator span {
            font-weight: 700;
            color: #facc15;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 1.2rem 0;
        }
        .cell {
            background: rgba(255,255,255,0.05);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 8px 0 rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .cell:hover { background: rgba(255,255,255,0.12); transform: scale(1.02); }
        .cell:active { transform: scale(0.95); }
        .cell.x { color: #60a5fa; text-shadow: 0 0 20px #3b82f680; }
        .cell.o { color: #f472b6; text-shadow: 0 0 20px #ec489980; }
        .status {
            font-size: 1.1rem;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.8rem 0 1.2rem;
            background: rgba(0,0,0,0.2);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .status.win { color: #4ade80; }
        .status.draw { color: #facc15; }
        button {
            background: rgba(255,255,255,0.07);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            color: #e8edf5;
            cursor: pointer;
            transition: 0.25s ease;
            border: 1px solid rgba(255,255,255,0.06);
            letter-spacing: 1px;
        }
        button:hover { background: rgba(255,255,255,0.15); transform: scale(1.02); }
        button:active { transform: scale(0.96); }
        .score {
            display: flex;
            justify-content: space-between;
            margin-top: 1.2rem;
            font-size: 0.95rem;
            background: rgba(0,0,0,0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .score span { font-weight: 700; }
        .score .x-score { color: #60a5fa; }
        .score .o-score { color: #f472b6; }
        .score .draw-score { color: #facc15; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✦ XO ✦</h1>
        <div class="turn-indicator">Turn: <span id="turnDisplay">X</span></div>

        <div class="board" id="board">
            <!-- 9 cells will be injected by JS -->
        </div>

        <div class="status" id="status">Player X's turn</div>
        <button id="resetBtn">↻ New Game</button>

        <div class="score">
            <span>X <span class="x-score" id="scoreX">0</span></span>
            <span>Draw <span class="draw-score" id="scoreDraw">0</span></span>
            <span>O <span class="o-score" id="scoreO">0</span></span>
        </div>
    </div>

    <script>
        (function() {
            // ----- Game State -----
            const boardEl = document.getElementById('board');
            const statusEl = document.getElementById('status');
            const turnDisplay = document.getElementById('turnDisplay');
            const resetBtn = document.getElementById('resetBtn');

            const scoreXEl = document.getElementById('scoreX');
            const scoreOEl = document.getElementById('scoreO');
            const scoreDrawEl = document.getElementById('scoreDraw');

            let board = Array(9).fill(null);
            let currentPlayer = 'X';       // 'X' always starts
            let gameActive = true;
            let scores = { X: 0, O: 0, draw: 0 };

            // Win patterns (8 lines)
            const WIN_PATTERNS = [
                [0,1,2], [3,4,5], [6,7,8],  // rows
                [0,3,6], [1,4,7], [2,5,8],  // columns
                [0,4,8], [2,4,6]            // diagonals
            ];

            // ----- Render Board -----
            function renderBoard() {
                boardEl.innerHTML = '';
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (board[i] === 'X') cell.classList.add('x');
                    if (board[i] === 'O') cell.classList.add('o');
                    cell.textContent = board[i] || '';
                    cell.dataset.index = i;
                    cell.addEventListener('click', handleCellClick);
                    boardEl.appendChild(cell);
                }
                turnDisplay.textContent = currentPlayer;
            }

            // ----- Check Winner -----
            function checkWinner() {
                for (const pattern of WIN_PATTERNS) {
                    const [a,b,c] = pattern;
                    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                        return board[a]; // 'X' or 'O'
                    }
                }
                return null;
            }

            function isBoardFull() {
                return board.every(cell => cell !== null);
            }

            // ----- Update Status & Scores -----
            function updateGameStatus(winner) {
                if (winner) {
                    gameActive = false;
                    statusEl.textContent = `🏆 Player ${winner} wins!`;
                    statusEl.className = 'status win';
                    scores[winner] += 1;
                    updateScoreDisplay();
                } else if (isBoardFull()) {
                    gameActive = false;
                    statusEl.textContent = `🤝 It's a draw!`;
                    statusEl.className = 'status draw';
                    scores.draw += 1;
                    updateScoreDisplay();
                } else {
                    statusEl.textContent = `Player ${currentPlayer}'s turn`;
                    statusEl.className = 'status';
                }
            }

            function updateScoreDisplay() {
                scoreXEl.textContent = scores.X;
                scoreOEl.textContent = scores.O;
                scoreDrawEl.textContent = scores.draw;
            }

            // ----- Cell Click Handler -----
            function handleCellClick(e) {
                const index = parseInt(e.currentTarget.dataset.index, 10);

                // Ignore if game over, cell taken, or invalid
                if (!gameActive) return;
                if (board[index] !== null) return;

                // Place mark
                board[index] = currentPlayer;
                renderBoard();

                // Check win / draw
                const winner = checkWinner();
                if (winner) {
                    updateGameStatus(winner);
                    renderBoard(); // re-render to keep UI consistent
                    return;
                }
                if (isBoardFull()) {
                    updateGameStatus(null); // draw
                    renderBoard();
                    return;
                }

                // Switch player
                currentPlayer = (currentPlayer === 'X' ? 'O' : 'X');
                turnDisplay.textContent = currentPlayer;
                statusEl.textContent = `Player ${currentPlayer}'s turn`;
                statusEl.className = 'status';
            }

            // ----- Reset Game -----
            function resetGame() {
                board = Array(9).fill(null);
                currentPlayer = 'X';
                gameActive = true;
                statusEl.textContent = `Player X's turn`;
                statusEl.className = 'status';
                renderBoard();
            }

            // ----- Full Reset (clears scores) -----
            function fullReset() {
                scores = { X: 0, O: 0, draw: 0 };
                updateScoreDisplay();
                resetGame();
            }

            // ----- Init -----
            function init() {
                resetGame();
                resetBtn.addEventListener('click', fullReset);
            }

            init();
        })();
    </script>
</body>
</html>
